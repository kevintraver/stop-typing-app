name: StopTyping

options:
  bundleIdPrefix: com.kevintraver
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

packages:
  StopTypingCore:
    path: StopTypingCore
  # Pinned to an exact release so every build embeds the same, known framework and XPC services.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.4

settings:
  base:
    SWIFT_VERSION: "6.0"
    # The single source of the app's version: Info.plist and scripts/release.sh both read these.
    MARKETING_VERSION: "1.0.4"
    CURRENT_PROJECT_VERSION: "5"

targets:
  StopTypingPrivacyTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: StopTypingPrivacyTests
      - path: StopTyping/Input/KeyboardTap.swift
      - path: StopTyping/App/Preferences.swift
      - path: StopTyping/App/StatsRollover.swift
    dependencies:
      - package: StopTypingCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
  StopTyping:
    type: application
    platform: macOS
    sources:
      - path: StopTyping
        excludes:
          - Resources/AppIcon.icon
      - path: StopTyping/Resources/AppIcon.icon
        type: file
        buildPhase: resources
    dependencies:
      - package: StopTypingCore
      - package: Sparkle
    info:
      path: StopTyping/Info.plist
      properties:
        CFBundleDisplayName: Stop Typing App
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "© 2026 Kevin Traver"
        NSFocusStatusUsageDescription: Stop Typing App stays quiet while a Focus like Do Not Disturb is on.
        # Sparkle. The appcast is attached to every GitHub release, so "latest" always points at the newest one.
        SUFeedURL: https://github.com/$(GITHUB_REPO)/releases/latest/download/appcast.xml
        # Empty in development builds, which keeps the updater from starting (see Updater.swift).
        # scripts/release.sh fills it in from the EdDSA key in the keychain.
        SUPublicEDKey: $(SPARKLE_PUBLIC_KEY)
        # Off until the user opts in (setup window or Settings), so out of the box the app makes no
        # network connections at all, as the site promises. Set explicitly so Sparkle never asks on its own.
        SUEnableAutomaticChecks: false
        SUEnableSystemProfiling: false
        SUSendProfileInfo: false
        # A sandboxed app can't replace itself, so Sparkle's Installer XPC service does it from outside the sandbox.
        SUEnableInstallerLauncherService: true
        # The app has no network entitlement, so Sparkle's Downloader XPC service fetches the appcast and updates.
        SUEnableDownloaderService: true
    entitlements:
      path: StopTyping/StopTyping.entitlements
      properties:
        # Sandboxed so the app can only reach what it needs; it has no network or file access of its own.
        # Input Monitoring is a TCC permission the user grants, not an entitlement.
        com.apple.security.app-sandbox: true
        # Lets the Ignore tab read the .app bundles the user picks in the open panel, to get their bundle IDs.
        com.apple.security.files.user-selected.read-only: true
        # Lets the sandboxed app reach Sparkle's installer, which listens on these two Mach services
        # (status and installer connections). Required by Sparkle's sandboxing guide.
        com.apple.security.temporary-exception.mach-lookup.global-name:
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spks
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spki
    settings:
      base:
        PRODUCT_NAME: Stop Typing App
        PRODUCT_MODULE_NAME: StopTyping
        PRODUCT_BUNDLE_IDENTIFIER: com.kevintraver.StopTyping
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        # Where releases (and Sparkle's appcast) are published. scripts/release.sh passes its own GITHUB_REPO.
        GITHUB_REPO: kevintraver/stop-typing-app
        # Sparkle's EdDSA public key. Never commit one here; scripts/release.sh injects it.
        SPARKLE_PUBLIC_KEY: ""
        # Notarization requires the hardened runtime on every signed binary.
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: 8EDDZ23NT2
      configs:
        Debug:
          # A stable signing identity keeps macOS's Input Monitoring grant across rebuilds.
          CODE_SIGN_IDENTITY: Apple Development
        Release:
          # Release builds are distributed outside the App Store, so they're signed with Developer ID
          # and a secure timestamp, both of which notarization requires. scripts/release.sh overrides
          # the identity when no Developer ID certificate is installed yet.
          CODE_SIGN_IDENTITY: Developer ID Application
          OTHER_CODE_SIGN_FLAGS: --timestamp

  # iPhone: the app is a setup guide and settings; the keyboard extension is the product.
  StopTypingiOS:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: StopTypingiOS
        excludes:
          - Resources/AppIcon.icon
      - path: StopTypingiOS/Resources/AppIcon.icon
        type: file
        buildPhase: resources
      - path: StopTypingShared
    dependencies:
      - package: StopTypingCore
      - target: StopTypingKeyboard
    info:
      path: StopTypingiOS/Info.plist
      properties:
        CFBundleDisplayName: Stop Typing App
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    entitlements:
      path: StopTypingiOS/StopTypingiOS.entitlements
      properties:
        # Shared with the keyboard, which reads the settings written here.
        com.apple.security.application-groups: [group.com.kevintraver.StopTyping]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kevintraver.StopTyping.ios
        # The iPhone app is versioned on its own; the Mac app's version is the top-level one above.
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 8EDDZ23NT2

  StopTypingKeyboard:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: StopTypingKeyboard
      - path: StopTypingShared
    dependencies:
      - package: StopTypingCore
    info:
      path: StopTypingKeyboard/Info.plist
      properties:
        CFBundleDisplayName: Stop Typing App
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            # Never asks for Full Access: no network, no shared writes, nothing leaves the keyboard.
            RequestsOpenAccess: false
    entitlements:
      path: StopTypingKeyboard/StopTypingKeyboard.entitlements
      properties:
        com.apple.security.application-groups: [group.com.kevintraver.StopTyping]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kevintraver.StopTyping.ios.keyboard
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 8EDDZ23NT2

schemes:
  StopTyping:
    build:
      targets:
        StopTyping: all
    test:
      targets:
        - StopTypingPrivacyTests
  StopTypingiOS:
    build:
      targets:
        StopTypingiOS: all
