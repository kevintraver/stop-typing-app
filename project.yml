name: StopTyping

options:
  bundleIdPrefix: com.kevintraver
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

packages:
  StopTypingCore:
    path: StopTypingCore

settings:
  base:
    SWIFT_VERSION: "6.0"
    # The single source of the app's version: Info.plist and scripts/release.sh both read these.
    MARKETING_VERSION: "2.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  StopTyping:
    type: application
    platform: macOS
    sources:
      - path: StopTyping
        excludes:
          - Resources/AppIcon.icon
      - path: StopTyping/Resources/AppIcon.icon
        type: file
        buildPhase: resources
    dependencies:
      - package: StopTypingCore
    info:
      path: StopTyping/Info.plist
      properties:
        CFBundleDisplayName: Stop Typing App
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "© 2026 Kevin Traver"
        NSFocusStatusUsageDescription: Stop Typing App stays quiet while a Focus like Do Not Disturb is on.
    entitlements:
      path: StopTyping/StopTyping.entitlements
      properties:
        # Sandboxed so the app can only reach what it needs; it has no network or file access of its own.
        # Input Monitoring is a TCC permission the user grants, not an entitlement.
        com.apple.security.app-sandbox: true
        # Lets the Ignore tab read the .app bundles the user picks in the open panel, to get their bundle IDs.
        com.apple.security.files.user-selected.read-only: true
    settings:
      base:
        PRODUCT_NAME: Stop Typing App
        PRODUCT_MODULE_NAME: StopTyping
        PRODUCT_BUNDLE_IDENTIFIER: com.kevintraver.StopTyping
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        # Notarization requires the hardened runtime on every signed binary.
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: 8EDDZ23NT2
      configs:
        Debug:
          # A stable signing identity keeps macOS's Input Monitoring grant across rebuilds.
          CODE_SIGN_IDENTITY: Apple Development
        Release:
          # Release builds are distributed outside the App Store, so they're signed with Developer ID
          # and a secure timestamp, both of which notarization requires. scripts/release.sh overrides
          # the identity when no Developer ID certificate is installed yet.
          CODE_SIGN_IDENTITY: Developer ID Application
          OTHER_CODE_SIGN_FLAGS: --timestamp
